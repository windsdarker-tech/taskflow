<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskFlow">
<meta name="application-name" content="TaskFlow">
<meta name="theme-color" content="#1D6B4F">
<meta name="description" content="Staff task management app">
<meta name="mobile-web-app-capable" content="yes">
<!-- PWA Manifest (inline via JS) -->
<link id="manifest-link" rel="manifest">
<!-- Apple touch icons (inline SVG converted) -->
<link rel="apple-touch-icon" id="apple-icon">
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#F2F1ED;color:#1A1917;font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden}

/* ── VARIABLES ── */
:root{
  --green:#1D6B4F;--green-l:#E1F5EE;--green-m:#1D9E75;
  --blue:#185FA5;--blue-l:#E6F1FB;
  --red:#A32D2D;--red-l:#FCEBEB;
  --amber:#BA7517;--amber-l:#FAEEDA;
  --purple:#534AB7;--purple-l:#EEEDFE;
  --surface:#FFFFFF;--surface2:#EEECEA;
  --border:#E2E0D8;--border2:#C8C6BF;
  --text:#1A1917;--text2:#6B6960;--text3:#9C9A93;
  --r:10px;--rL:14px;
}

/* ══════════════════════════════
   LOGIN
══════════════════════════════ */
#login-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:16px;background:#F2F1ED;
}
.login-box{
  background:#fff;border:1px solid var(--border);border-radius:var(--rL);
  padding:28px 20px;width:100%;max-width:360px;
}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.brand-icon{width:34px;height:34px;background:var(--green);border-radius:9px;display:flex;align-items:center;justify-content:center}
.brand-icon svg{width:18px;height:18px;fill:#fff}
.brand-name{font-size:18px;font-weight:600;letter-spacing:-0.3px}
.brand-name b{color:var(--green);font-weight:600}
.login-box h2{font-size:18px;font-weight:600;margin-bottom:4px}
.login-box .sub{color:var(--text2);font-size:13px;margin-bottom:20px}

.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);
  font-family:inherit;font-size:15px;background:#fff;color:var(--text);outline:none;
  -webkit-appearance:none;appearance:none;transition:border .15s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green-m);box-shadow:0 0 0 3px rgba(29,158,117,.12)}
.field textarea{resize:vertical;min-height:76px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:var(--r);font-family:inherit;font-size:14px;
  font-weight:500;cursor:pointer;border:none;transition:opacity .15s;white-space:nowrap
}
.btn:active{opacity:.8}
.btn-green{background:var(--green);color:#fff;width:100%}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text)}
.btn-outline:active{background:var(--surface2)}
.btn-sm{padding:8px 13px;font-size:13px}
.btn-success{background:var(--green-l);color:var(--green);border:1px solid #9FE1CB}
.btn-danger{background:var(--red-l);color:var(--red);border:1px solid #F0C0C0}

.divider{text-align:center;color:var(--text3);font-size:12px;margin:16px 0}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{
  padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);
  cursor:pointer;text-align:left;background:#fff;font-family:inherit
}
.qbtn:active{border-color:var(--green-m);background:var(--green-l)}
.qbtn .qn{font-size:13px;font-weight:500}
.qbtn .qr{font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;display:inline-block;margin-top:3px}
.r-admin{background:var(--purple-l);color:var(--purple)}
.r-staff{background:var(--blue-l);color:var(--blue)}

/* ══════════════════════════════
   APP — MOBILE FIRST
══════════════════════════════ */
#app{display:none;min-height:100vh;background:#F2F1ED}

/* TOP BAR */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:54px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px
}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-right{display:flex;align-items:center;gap:6px}
.t-brand-icon{width:28px;height:28px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center}
.t-brand-icon svg{width:15px;height:15px;fill:#fff}
.t-brand-name{font-size:16px;font-weight:600;letter-spacing:-0.2px}
.t-brand-name b{color:var(--green);font-weight:600}
.notif-btn{
  position:relative;width:36px;height:36px;display:flex;align-items:center;
  justify-content:center;background:none;border:none;cursor:pointer;border-radius:8px
}
.notif-btn svg{width:21px;height:21px;stroke:var(--text2);fill:none;stroke-width:2;stroke-linecap:round}
.ndot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff}
.av-btn{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:600;cursor:pointer;border:none
}

/* MAIN SCROLL AREA */
.main{
  padding-top:70px;    /* top bar + breathing room */
  padding-bottom:80px; /* bottom nav + breathing room */
  padding-left:16px;
  padding-right:16px;
  min-height:100vh
}

/* BOTTOM NAV */
.botnav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  padding-bottom:env(safe-area-inset-bottom,0px)
}
.bni{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 4px;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:10px;font-weight:500;color:var(--text3);
  position:relative;transition:color .12s
}
.bni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bni.on{color:var(--green)}
.bnbadge{
  position:absolute;top:5px;right:calc(50% - 18px);
  background:var(--red);color:#fff;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:10px;line-height:1.4
}

/* ══════════════════════════════
   PAGE CONTENT
══════════════════════════════ */
.ph{margin-bottom:16px}
.ph h1{font-size:19px;font-weight:600;letter-spacing:-.3px}
.ph p{color:var(--text2);font-size:13px;margin-top:2px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.scard{background:#fff;border:1px solid var(--border);border-radius:var(--rL);padding:14px}
.slbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.snum{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1}
.ssub{font-size:11px;color:var(--text3);margin-top:3px}

.sec-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-bar h2{font-size:15px;font-weight:600}

.fscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;padding-bottom:2px}
.frow{display:flex;gap:6px;width:max-content}
.fbtn{
  padding:7px 14px;border-radius:20px;border:1px solid var(--border2);
  background:#fff;cursor:pointer;font-size:12px;font-weight:500;
  color:var(--text2);font-family:inherit;white-space:nowrap
}
.fbtn.on{background:var(--green);border-color:var(--green);color:#fff}

/* TASK CARDS */
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{
  background:#fff;border:1px solid var(--border);border-radius:var(--rL);
  padding:14px 14px 14px 10px;display:flex;align-items:flex-start;gap:10px
}
.tbar{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0;min-height:50px}
.p-high{background:var(--red)}
.p-medium{background:var(--amber)}
.p-low{background:#9FE1CB}
.tbody{flex:1;min-width:0}
.ttop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
.ttitle{font-size:14px;font-weight:500;line-height:1.3}
.tdesc{font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.4}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.tacts{display:flex;flex-wrap:wrap;gap:6px}

.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500;white-space:nowrap}
.b-pend{background:var(--amber-l);color:var(--amber)}
.b-prog{background:var(--blue-l);color:var(--blue)}
.b-rev{background:var(--purple-l);color:var(--purple)}
.b-done{background:var(--green-l);color:var(--green)}
.b-rej{background:var(--red-l);color:var(--red)}

.tassign{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:5px}
.tdue{font-size:12px;color:var(--text3)}
.tdue.late{color:var(--red);font-weight:500}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}

/* MEMBERS */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{background:#fff;border:1px solid var(--border);border-radius:var(--rL);padding:14px}
.mtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.ms{background:var(--surface2);border-radius:8px;padding:7px 8px;text-align:center}
.msn{font-size:16px;font-weight:600}
.msl{font-size:10px;color:var(--text3)}

/* NOTIFS */
.nlist{display:flex;flex-direction:column;gap:8px}
.nitem{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.nitem.unread{border-left:3px solid var(--green)}
.ndotinl{width:8px;height:8px;background:var(--green);border-radius:50%;flex-shrink:0;margin-top:5px}
.ntxt{font-size:13px;line-height:1.4}
.ntime{font-size:11px;color:var(--text3);margin-top:3px}

/* ══════════════════════════════
   MODAL — slides up from bottom
══════════════════════════════ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:flex;align-items:flex-end;justify-content:center
}
.modal{
  background:#fff;border-radius:var(--rL) var(--rL) 0 0;
  padding:0 16px 32px;width:100%;max-width:520px;
  max-height:90vh;overflow-y:auto;
  padding-bottom:max(32px,env(safe-area-inset-bottom,0px))
}
.mhandle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 16px}
.modal h3{font-size:17px;font-weight:600;margin-bottom:16px}
.mfooter{display:flex;gap:8px;margin-top:16px}
.mfooter .btn{flex:1}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* TOAST */
.toasts{
  position:fixed;bottom:80px;left:16px;right:16px;z-index:300;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none
}
.toast{
  background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:500;max-width:300px;text-align:center;
  animation:toastIn .2s ease
}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

.empty{text-align:center;padding:48px 16px;color:var(--text3)}
.empty svg{width:38px;height:38px;margin:0 auto 12px;display:block;opacity:.3;stroke:currentColor;fill:none;stroke-width:1.5}
.empty p{font-size:14px}

.hidden{display:none!important}
.sidebar{display:none}

/* ══════════════════════════════
   DESKTOP OVERRIDE ≥ 700px
══════════════════════════════ */
@media(min-width:700px){
  /* show sidebar, hide mobile chrome */
  .topbar{display:none!important}
  .botnav{display:none!important}

  .sidebar{
    width:220px;position:fixed;top:0;left:0;bottom:0;z-index:100;
    background:#fff;border-right:1px solid var(--border);
    display:flex!important;flex-direction:column;padding:20px 0
  }
  .sidebar .sb-logo{padding:0 20px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;margin-bottom:0}
  .sidebar .sb-logo .brand-icon{width:30px;height:30px;border-radius:8px}
  .sidebar .sb-section{padding:12px 10px 8px}
  .sidebar .sb-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:0 8px;margin-bottom:4px;display:block}
  .dni{
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
    cursor:pointer;color:var(--text2);font-size:13px;font-weight:400;
    border:none;background:none;font-family:inherit;width:100%;text-align:left;transition:all .12s
  }
  .dni:hover{background:var(--surface2);color:var(--text)}
  .dni.on{background:var(--green-l);color:var(--green);font-weight:500}
  .dni svg{width:16px;height:16px;fill:currentColor;flex-shrink:0}
  .dbadge{margin-left:auto;background:var(--green);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px}
  .sb-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--border)}

  .main{margin-left:220px;padding:28px;padding-bottom:28px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .mlist{display:grid;grid-template-columns:repeat(3,1fr)}
  .overlay{align-items:center}
  .modal{border-radius:var(--rL);max-width:480px}
  .toasts{bottom:24px;left:auto;right:24px;align-items:flex-end}
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="brand">
      <div class="brand-icon"><svg viewBox="0 0 18 18"><path d="M3 3h5v5H3zM10 3h5v2h-5zM10 7h5v1h-5zM3 10h12v5H3z"/></svg></div>
      <div class="brand-name">Task<b>Flow</b></div>
    </div>
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your workspace</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="l-user" placeholder="Enter username" autocapitalize="none" autocomplete="username"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="l-pass" placeholder="Enter password" autocomplete="current-password"/>
    </div>
    <button class="btn btn-green" onclick="doLogin()">Sign In</button>
    <div class="divider">— quick sign in —</div>
    <div class="quick-grid" id="qgrid"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">

  <!-- Desktop Sidebar (hidden on mobile via CSS) -->
  <nav class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="brand-icon"><svg viewBox="0 0 18 18"><path d="M3 3h5v5H3zM10 3h5v2h-5zM10 7h5v1h-5zM3 10h12v5H3z"/></svg></div>
      <div class="brand-name">Task<b>Flow</b></div>
    </div>
    <div class="sb-section">
      <span class="sb-lbl">Menu</span>
      <button class="dni on" id="dn-dashboard" onclick="go('dashboard')">
        <svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="4" rx="1"/><rect x="9" y="7" width="6" height="2" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="11" width="6" height="4" rx="1"/></svg>
        Dashboard
      </button>
      <button class="dni" id="dn-tasks" onclick="go('tasks')">
        <svg viewBox="0 0 16 16"><path d="M2 2h12v2H2zM2 6h12v2H2zM2 10h8v2H2z"/></svg>
        <span id="dn-tlbl">All Tasks</span>
        <span class="dbadge hidden" id="dn-tb">0</span>
      </button>
      <button class="dni hidden" id="dn-members" onclick="go('members')">
        <svg viewBox="0 0 16 16"><circle cx="6" cy="4" r="3"/><path d="M0 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="13" cy="5" r="2"/><path d="M16 14c0-2.2-1.3-4-3-4.5"/></svg>
        Staff Members
      </button>
      <button class="dni" id="dn-notifications" onclick="go('notifications')">
        <svg viewBox="0 0 16 16"><path d="M8 1a5 5 0 00-5 5v3l-1.5 2h13L13 9V6a5 5 0 00-5-5zm0 14a2 2 0 01-2-2h4a2 2 0 01-2 2z"/></svg>
        Notifications
        <span class="dbadge hidden" id="dn-nb">0</span>
      </button>
    </div>
    <div class="sb-foot">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div class="av" id="d-av" style="width:30px;height:30px;font-size:11px"></div>
        <div>
          <div style="font-size:13px;font-weight:500" id="d-name"></div>
          <div style="font-size:11px;color:var(--text3)" id="d-role"></div>
        </div>
      </div>
      <button class="btn btn-outline btn-sm" style="width:100%" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <!-- Mobile Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="t-brand-icon"><svg viewBox="0 0 18 18"><path d="M3 3h5v5H3zM10 3h5v2h-5zM10 7h5v1h-5zM3 10h12v5H3z"/></svg></div>
      <div class="t-brand-name">Task<b>Flow</b></div>
    </div>
    <div class="topbar-right">
      <button class="notif-btn" onclick="go('notifications')">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <div class="ndot hidden" id="t-ndot"></div>
      </button>
      <button class="av-btn" id="t-av" onclick="openProfile()"></button>
    </div>
  </header>

  <!-- Page Content -->
  <main class="main" id="content"></main>

  <!-- Mobile Bottom Nav -->
  <nav class="botnav">
    <button class="bni on" id="mn-dashboard" onclick="go('dashboard')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Home
    </button>
    <button class="bni" id="mn-tasks" onclick="go('tasks')">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Tasks
      <span class="bnbadge hidden" id="mn-tb">!</span>
    </button>
    <button class="bni hidden" id="mn-members" onclick="go('members')">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Staff
    </button>
    <button class="bni" id="mn-notifications" onclick="go('notifications')">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      Alerts
      <span class="bnbadge hidden" id="mn-nb">!</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div class="toasts" id="toasts"></div>

<!-- Modal -->
<div class="overlay hidden" id="overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="mhandle"></div>
    <div id="mcontent"></div>
  </div>
</div>

<script>

const DEF={
  users:[

    {id:'u2',name:'Ibrahim', username:'ibrahim', pass:'pass123', role:'staff',c:'#1D6B4F'},

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
let S=load()||JSON.parse(JSON.stringify(DEF));
let U=null,page='dashboard',filter='all';

// ─── AUTH ───
function buildQuick(){
  const g=document.getElementById('qgrid');
  [S.users[0],S.users[1],S.users[3],S.users[5]].forEach(u=>{
    const b=document.createElement('button');
    b.className='qbtn';
    b.innerHTML=`<div class="qn">${u.name}</div><div class="qr ${u.role==='admin'?'r-admin':'r-staff'}">${u.role}</div>`;
    b.onclick=()=>loginAs(u);
    g.appendChild(b);
  });
}
function doLogin(){
  const u=document.getElementById('l-user').value.trim().toLowerCase();
  const p=document.getElementById('l-pass').value;
  const user=S.users.find(x=>x.username===u&&x.pass===p);
  if(!user){toast('Invalid credentials','err');return;}
  loginAs(user);
}
function loginAs(user){
  U=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  setupUI();go('dashboard');
}
function logout(){
  U=null;closeModal();
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('l-user').value='';
  document.getElementById('l-pass').value='';
}

function ini(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}

function setupUI(){
  const isA=U.role==='admin';
  // mobile top avatar
  const ta=document.getElementById('t-av');
  ta.textContent=ini(U.name);
  ta.style.background=U.c+'28';ta.style.color=U.c;
  // desktop sidebar
  const da=document.getElementById('d-av');
  da.textContent=ini(U.name);da.style.background=U.c+'28';da.style.color=U.c;
  document.getElementById('d-name').textContent=U.name;
  document.getElementById('d-role').textContent=isA?'Administrator':'Staff';
  document.getElementById('dn-tlbl').textContent=isA?'All Tasks':'My Tasks';
  // admin-only items
  ['mn-members','dn-members'].forEach(id=>{
    document.getElementById(id).classList[isA?'remove':'add']('hidden');
  });
  badges();
}

function badges(){
  if(!U)return;
  const nb=S.notifs.filter(n=>n.to===U.id&&!n.read).length;
  setB('mn-nb',nb);setB('dn-nb',nb);
  const dot=document.getElementById('t-ndot');
  if(dot)dot.classList[nb>0?'remove':'add']('hidden');
  if(U.role==='staff'){
    const rb=S.tasks.filter(t=>t.aid===U.id&&t.st==='review').length;
    setB('mn-tb',rb);setB('dn-tb',rb);
  }
}
function setB(id,n){
  const el=document.getElementById(id);if(!el)return;
  if(n>0){el.textContent=n;el.classList.remove('hidden');}else el.classList.add('hidden');
}

// ─── NAV ───
function go(p){
  page=p;
  document.querySelectorAll('.bni').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.dni').forEach(e=>e.classList.remove('on'));
  const mn=document.getElementById('mn-'+p);if(mn)mn.classList.add('on');
  const dn=document.getElementById('dn-'+p);if(dn)dn.classList.add('on');
  const c=document.getElementById('content');
  if(p==='dashboard')c.innerHTML=dash();
  else if(p==='tasks')c.innerHTML=tasksPage();
  else if(p==='members')c.innerHTML=membersPage();
  else if(p==='notifications'){c.innerHTML=notifsPage();markRead();}
  window.scrollTo(0,0);badges();
}

// ─── DASHBOARD ───
function dash(){
  const isA=U.role==='admin';
  const my=isA?S.tasks:S.tasks.filter(t=>t.aid===U.id);
  const pend=my.filter(t=>t.st==='pending').length;
  const prog=my.filter(t=>t.st==='in_progress').length;
  const rev=my.filter(t=>t.st==='review').length;
  const done=my.filter(t=>t.st==='done').length;
  const rec=[...my].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,5);
  return`
<div class="ph"><h1>Hi, ${U.name.split(' ')[0]} 👋</h1><p>${isA?'Team task overview':'Your task summary'}</p></div>
<div class="stats">
  <div class="scard"><div class="slbl">Total</div><div class="snum">${my.length}</div><div class="ssub">${isA?'All tasks':'Assigned'}</div></div>
  <div class="scard"><div class="slbl">Active</div><div class="snum" style="color:var(--blue)">${prog}</div><div class="ssub">${pend} pending</div></div>
  <div class="scard"><div class="slbl">Review</div><div class="snum" style="color:var(--purple)">${rev}</div><div class="ssub">Needs approval</div></div>
  <div class="scard"><div class="slbl">Done</div><div class="snum" style="color:var(--green)">${done}</div><div class="ssub">Completed</div></div>
</div>
<div class="sec-bar"><h2>Recent Tasks</h2><button class="btn btn-outline btn-sm" onclick="go('tasks')">View all</button></div>
<div class="tlist">${rec.length?rec.map(t=>tcard(t,true)).join(''):empty('No tasks yet')}</div>
${isA?`<div style="margin-top:14px"><button class="btn btn-green" onclick="openCreate()">+ Assign New Task</button></div>`:''}`;
}

// ─── TASKS PAGE ───
function tasksPage(){
  const isA=U.role==='admin';
  let tasks=isA?S.tasks:S.tasks.filter(t=>t.aid===U.id);
  if(filter!=='all')tasks=tasks.filter(t=>t.st===filter);
  tasks=[...tasks].sort((a,b)=>{const o={high:0,medium:1,low:2};return o[a.pri]-o[b.pri]||a.due.localeCompare(b.due);});
  const fl=['all','pending','in_progress','review','done'];
  const fn={all:'All',pending:'Pending',in_progress:'In Progress',review:'For Review',done:'Done'};
  return`
<div class="ph"><h1>${isA?'All Tasks':'My Tasks'}</h1><p>${isA?'Assign, track and confirm tasks':'Tasks assigned to you'}</p></div>
<div class="fscroll"><div class="frow">${fl.map(f=>`<button class="fbtn ${filter===f?'on':''}" onclick="setF('${f}')">${fn[f]}</button>`).join('')}</div></div>
${isA?`<div style="margin-bottom:14px"><button class="btn btn-green" onclick="openCreate()">+ Assign New Task</button></div>`:''}
<div class="tlist">${tasks.length?tasks.map(t=>tcard(t,true)).join(''):empty('No tasks found')}</div>`;
}
function setF(f){filter=f;go('tasks');}

// ─── TASK CARD ───
function tcard(t,act=false){
  const isA=U.role==='admin';
  const u=S.users.find(x=>x.id===t.aid);
  const today=new Date().toISOString().slice(0,10);
  const late=t.due<today&&t.st!=='done';
  const bc={pending:'b-pend',in_progress:'b-prog',review:'b-rev',done:'b-done',rejected:'b-rej'};
  const bl={pending:'Pending',in_progress:'In Progress',review:'For Review',done:'Done ✓',rejected:'Rejected'};
  const pc={high:'p-high',medium:'p-medium',low:'p-low'};
  let actions='';
  if(act){
    if(isA){
      if(t.st==='review')actions=`<button class="btn btn-success btn-sm" onclick="approve('${t.id}')">✓ Approve</button><button class="btn btn-danger btn-sm" onclick="reject('${t.id}')">✗ Reject</button>`;
      else if(t.st!=='done')actions=`<button class="btn btn-outline btn-sm" onclick="openEdit('${t.id}')">Edit</button><button class="btn btn-danger btn-sm" onclick="del('${t.id}')">Delete</button>`;
    }else{
      if(t.st==='pending')actions=`<button class="btn btn-outline btn-sm" onclick="start('${t.id}')">Start Task</button>`;
      else if(t.st==='in_progress')actions=`<button class="btn btn-success btn-sm" onclick="submit('${t.id}')">Mark Complete</button>`;
      else if(t.st==='rejected')actions=`<button class="btn btn-outline btn-sm" onclick="start('${t.id}')">Redo Task</button>`;
    }
  }
  return`<div class="tcard">
  <div class="tbar ${pc[t.pri]}"></div>
  <div class="tbody">
    <div class="ttop"><div class="ttitle">${t.title}</div><span class="badge ${bc[t.st]}">${bl[t.st]}</span></div>
    <div class="tdesc">${t.desc}</div>
    <div class="tmeta">
      <div class="tassign"><div class="av" style="width:20px;height:20px;font-size:9px;background:${(u?.c||'#888')+'28'};color:${u?.c||'#888'}">${u?ini(u.name):'?'}</div>${u?.name||'?'}</div>
      <span class="tdue ${late?'late':''}">📅 ${fd(t.due)}${late?' · Overdue':''}</span>
    </div>
    ${actions?`<div class="tacts">${actions}</div>`:''}
  </div></div>`;
}

// ─── ACTIONS ───
function start(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.st='in_progress';save();addN(t.by,`${U.name} started: "${t.title}"`,id);toast('Task started!','ok');go(page);}
function submit(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.st='review';save();addN(t.by,`${U.name} completed "${t.title}" — awaiting your approval.`,id);toast('Submitted for review!','ok');go(page);}
function approve(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.st='done';t.done=new Date().toISOString().slice(0,10);save();addN(t.aid,`✅ Your task "${t.title}" was approved!`,id);toast('Task approved!','ok');go(page);}
function reject(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;t.st='rejected';save();addN(t.aid,`❌ Your task "${t.title}" was rejected. Please redo it.`,id);toast('Task rejected.','err');go(page);}
function del(id){if(!confirm('Delete this task?'))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();toast('Deleted');go(page);}

// ─── CREATE/EDIT ───
function sopts(sel){return S.users.filter(u=>u.role==='staff').map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${u.name}</option>`).join('');}
function openCreate(pre){
  document.getElementById('mcontent').innerHTML=`
<h3>Assign New Task</h3>
<div class="field"><label>Task Title</label><input type="text" id="f-title" placeholder="What needs to be done?"/></div>
<div class="field"><label>Description</label><textarea id="f-desc" placeholder="Add details…"></textarea></div>
<div class="field"><label>Assign To</label><select id="f-aid">${sopts(pre)}</select></div>
<div class="two-col">
  <div class="field"><label>Priority</label><select id="f-pri"><option value="high">🔴 High</option><option value="medium" selected>🟡 Medium</option><option value="low">🟢 Low</option></select></div>
  <div class="field"><label>Due Date</label><input type="date" id="f-due"/></div>
</div>
<div class="mfooter"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="createTask()">Assign Task</button></div>`;
  document.getElementById('f-due').value=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  document.getElementById('overlay').classList.remove('hidden');
}
function createTask(){
  const title=document.getElementById('f-title').value.trim();
  const desc=document.getElementById('f-desc').value.trim();
  const aid=document.getElementById('f-aid').value;
  const pri=document.getElementById('f-pri').value;
  const due=document.getElementById('f-due').value;
  if(!title){toast('Title is required','err');return;}
  if(!due){toast('Please pick a due date','err');return;}
  const t={id:'t'+S.tid++,title,desc,aid,by:U.id,pri,st:'pending',due,at:new Date().toISOString().slice(0,10),done:null};
  S.tasks.push(t);
  addN(aid,`📋 New task: "${title}" — due ${fd(due)}`,t.id);
  save();closeModal();toast('Task assigned!','ok');go(page);
}
function openEdit(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  document.getElementById('mcontent').innerHTML=`
<h3>Edit Task</h3>
<div class="field"><label>Task Title</label><input type="text" id="f-title" value="${t.title}"/></div>
<div class="field"><label>Description</label><textarea id="f-desc">${t.desc}</textarea></div>
<div class="field"><label>Assign To</label><select id="f-aid">${sopts(t.aid)}</select></div>
<div class="two-col">
  <div class="field"><label>Priority</label><select id="f-pri"><option value="high" ${t.pri==='high'?'selected':''}>🔴 High</option><option value="medium" ${t.pri==='medium'?'selected':''}>🟡 Medium</option><option value="low" ${t.pri==='low'?'selected':''}>🟢 Low</option></select></div>
  <div class="field"><label>Due Date</label><input type="date" id="f-due" value="${t.due}"/></div>
</div>
<div class="mfooter"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-green" onclick="updateTask('${id}')">Save Changes</button></div>`;
  document.getElementById('overlay').classList.remove('hidden');
}
function updateTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.title=document.getElementById('f-title').value.trim();
  t.desc=document.getElementById('f-desc').value.trim();
  t.aid=document.getElementById('f-aid').value;
  t.pri=document.getElementById('f-pri').value;
  t.due=document.getElementById('f-due').value;
  if(!t.title){toast('Title required','err');return;}
  save();closeModal();toast('Updated!','ok');go(page);
}
function closeModal(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  document.getElementById('overlay').classList.add('hidden');
}

// ─── MEMBERS ───
function membersPage(){

  return`<div class="ph"><h1>Staff Members</h1><p>${staff.length} staff members</p></div>
<div class="mlist">${staff.map(u=>{
  const ut=S.tasks.filter(t=>t.aid===u.id);

// ─── UTILS ───
function empty(m){return`<div class="empty"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg><p>${m}</p></div>`;}
function fd(d){if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function ago(iso){const m=Math.floor((Date.now()-new Date(iso))/6e4);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function toast(msg,type=''){
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+type;el.textContent=msg;c.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// ─── PWA SERVICE WORKER (offline) ───
if('serviceWorker' in navigator){
  const sw=`const CACHE='tf-v1';
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll([self.location.pathname])).then(()=>self.skipWaiting()));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>r)));});`;
  const url=URL.createObjectURL(new Blob([sw],{type:'application/javascript'}));
  navigator.serviceWorker.register(url,{scope:'./'}).then(()=>console.log('PWA ready')).catch(()=>{});
}
